name: Forgum CI

on:
  push:
    branches: [main, animation]
    tags: ['v*']
  pull_request:
    branches: [main, animation]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MODULE_NAME: Forgum
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-audit:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - name: Rust Security Audit
        run: |
          cargo install --version 0.21.1 cargo-audit
          cd src-rust && cargo audit
      - name: Install cargo-mutants
        run: cargo install --version 24.11.0 cargo-mutants
      - name: Mutation Testing
        continue-on-error: true
        run: |
          cd src-rust
          timeout 300 cargo mutants --no-times --file src/engine.rs || echo "Mutation testing timed out or failed (non-blocking)"
      - name: PowerShell Static Analysis
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force
          Invoke-ScriptAnalyzer -Path . -Settings ./PSScriptAnalyzerSettings.psd1 -EnableExit

  # ────────────────────────────────────────────
  # Phase 1: Fast feedback (parallel)
  # ────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    name: Lint
    env:
      PSSA_VERSION: '1.24.0'
    steps:
      - uses: actions/checkout@v4

      - name: Cache PSScriptAnalyzer
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules/PSScriptAnalyzer
          key: pssa-${{ runner.os }}-${{ env.PSSA_VERSION }}-${{ hashFiles('**/PSScriptAnalyzerSettings.psd1') }}

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $minVersion = [version]$env:PSSA_VERSION
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer | Where-Object { $_.Version -ge $minVersion })) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -MinimumVersion $env:PSSA_VERSION
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $excludedRules = @(
            'PSReviewUnusedParameter'
            'PSAvoidUsingWriteHost'
            'PSUseSingularNouns'
            'PSUseBOMForUnicodeEncodedFile'
            'PSUseDeclaredVarsMoreThanAssignments'
            'PSAvoidUsingEmptyCatchBlock'
            'PSUseShouldProcessForStateChangingFunctions'
          )
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning -ExcludeRule $excludedRules
          if ($results) {
            Write-Host "Found $($results.Count) issue(s):" -ForegroundColor Red
            $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize
            exit 1
          }
          Write-Host "No lint errors found." -ForegroundColor Green

  validate:
    runs-on: ubuntu-latest
    name: Validate
    steps:
      - uses: actions/checkout@v4

      - name: Validate module manifest
        shell: pwsh
        run: |
          $manifest = Test-ModuleManifest -Path ./${{ env.MODULE_NAME }}.psd1 -ErrorAction Stop
          Write-Host "Module: $($manifest.Name) v$($manifest.Version)"
          Write-Host "Author: $($manifest.Author)"
          Write-Host "Exports: $($manifest.ExportedFunctions.Keys -join ', ')"
          $expected = @('Invoke-Cowsay', 'Invoke-Forgum', 'Get-Fortune', 'Get-CFCow', 'Get-CFConfig', 'Set-CFConfig', 'Show-CFAnimation', 'Invoke-ForgumSetup', 'Update-Forgum')
          $actual = $manifest.ExportedFunctions.Keys
          $missing = $expected | Where-Object { $_ -notin $actual }
          if ($missing) {
            Write-Host "Missing exports: $($missing -join ', ')" -ForegroundColor Red
            exit 1
          }
          Write-Host "All 7 expected functions exported." -ForegroundColor Green

      - name: Verify data files
        shell: pwsh
        run: |
          $cowCount = (Get-ChildItem ./Data/Cows/*.cow).Count
          Write-Host "Cow files: $cowCount"
          if ($cowCount -lt 50) {
            Write-Host "Expected at least 50 cow files" -ForegroundColor Red
            exit 1
          }
          $fortuneRaw = Get-Content ./Data/Fortunes/fortunes.txt -Raw
          $fortuneCount = ($fortuneRaw -split '%').Count
          Write-Host "Fortune entries: $fortuneCount"
          if ($fortuneCount -lt 1000) {
            Write-Host "Expected at least 1000 fortune entries" -ForegroundColor Red
            exit 1
          }
          Write-Host "Data files verified." -ForegroundColor Green

      - name: Verify animation files
        shell: pwsh
        run: |
          $animFiles = Get-ChildItem ./Private/Animation/*.ps1 -ErrorAction SilentlyContinue
          $expected = @('Static', 'Talking', 'Typewriter', 'SlideIn', 'Bounce', 'Dissolve', 'FadeIn', 'Blink', 'Wiggle', 'Wave', 'Disco', 'Dynamic')
          if ($animFiles.Count -lt $expected.Count) {
            Write-Host "Expected $($expected.Count) animation files" -ForegroundColor Red
            exit 1
          }
          foreach ($name in $expected) {
            if (-not ($animFiles | Where-Object BaseName -eq $name)) {
              Write-Host "Missing animation: $name" -ForegroundColor Red
              exit 1
            }
          }
          Write-Host "All $($expected.Count) animation files present." -ForegroundColor Green

  # ────────────────────────────────────────────
  # Phase 2: Tests (depends on Phase 1)
  # ────────────────────────────────────────────
  test:
    needs: [lint, validate, security-audit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pwsh: '7.4'
          - os: macos-latest
            pwsh: '7.4'
          - os: windows-latest
            pwsh: '7.4'
          - os: windows-latest
            pwsh: '5.1'
    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.os }} pwsh ${{ matrix.pwsh }})
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust Tests
        run: cd src-rust && cargo test --verbose

      - name: Install Targets (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          rustup target add x86_64-pc-windows-msvc
          rustup target add aarch64-pc-windows-msvc

      - name: Install Targets (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add x86_64-unknown-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      - name: Install Targets (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Build Windows Binaries
        if: matrix.os == 'windows-latest'
        run: |
          cd src-rust
          cargo build --release --target x86_64-pc-windows-msvc
          cargo build --release --target aarch64-pc-windows-msvc
          cd ..
          mkdir -p bin
          cp src-rust/target/x86_64-pc-windows-msvc/release/forgum-core.exe bin/forgum-core.exe
          cp src-rust/target/aarch64-pc-windows-msvc/release/forgum-core.exe bin/forgum-core-arm64.exe
        shell: bash

      - name: Build Linux Binaries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          cd src-rust
          cargo build --release --target x86_64-unknown-linux-gnu
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc cargo build --release --target aarch64-unknown-linux-gnu
          cd ..
          mkdir -p bin
          cp src-rust/target/x86_64-unknown-linux-gnu/release/forgum-core bin/forgum-core
          cp src-rust/target/aarch64-unknown-linux-gnu/release/forgum-core bin/forgum-core-arm64
          chmod +x bin/forgum-core bin/forgum-core-arm64
        shell: bash

      - name: Build macOS Binaries
        if: matrix.os == 'macos-latest'
        run: |
          cd src-rust
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cd ..
          mkdir -p bin
          lipo -create -output bin/forgum-core-mac src-rust/target/x86_64-apple-darwin/release/forgum-core src-rust/target/aarch64-apple-darwin/release/forgum-core
          chmod +x bin/forgum-core-mac
        shell: bash

      - name: Upload Windows x64 Artifact
        if: matrix.os == 'windows-latest' && matrix.pwsh == '7.4'
        uses: actions/upload-artifact@v4
        with:
          name: forgum-core-x86_64-pc-windows-msvc
          path: src-rust/target/x86_64-pc-windows-msvc/release/forgum-core.exe
          if-no-files-found: error

      - name: Upload Windows ARM64 Artifact
        if: matrix.os == 'windows-latest' && matrix.pwsh == '7.4'
        uses: actions/upload-artifact@v4
        with:
          name: forgum-core-aarch64-pc-windows-msvc
          path: src-rust/target/aarch64-pc-windows-msvc/release/forgum-core.exe
          if-no-files-found: error

      - name: Upload Linux x64 Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: forgum-core-x86_64-unknown-linux-gnu
          path: src-rust/target/x86_64-unknown-linux-gnu/release/forgum-core
          if-no-files-found: error

      - name: Upload Linux ARM64 Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: forgum-core-aarch64-unknown-linux-gnu
          path: src-rust/target/aarch64-unknown-linux-gnu/release/forgum-core
          if-no-files-found: error

      - name: Upload macOS x64 Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: forgum-core-x86_64-apple-darwin
          path: src-rust/target/x86_64-apple-darwin/release/forgum-core
          if-no-files-found: error

      - name: Upload macOS ARM64 Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: forgum-core-aarch64-apple-darwin
          path: src-rust/target/aarch64-apple-darwin/release/forgum-core
          if-no-files-found: error

      - name: Install QEMU for ARM64 Emulation
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support

      - name: Verify ARM64 Binary via QEMU
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./bin/forgum-core-arm64 --version

      - name: Verify ARM64 Binary (native on Apple Silicon)
        if: matrix.os == 'macos-latest'
        run: |
          file ./bin/forgum-core-arm64
          ./bin/forgum-core-arm64 --version
        shell: bash

      - name: Cache Pester + modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/powershell/Modules
            ~/Documents/PowerShell/Modules
          key: modules-pester-5.7-${{ runner.os }}-${{ hashFiles('**/Forgum.psd1') }}

      - name: Install Pester (pwsh)
        if: matrix.pwsh != '5.1'
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version.Major -ge 5 })) {
            Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser -MinimumVersion 5.7.0 -MaximumVersion 5.99.99
          }
          Get-Module -ListAvailable -Name Pester | Where-Object Version.Major -ge 5 | Select-Object Name, Version | Format-Table -AutoSize

      - name: Install Pester (powershell)
        if: matrix.pwsh == '5.1'
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version.Major -ge 5 })) {
            Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser -MinimumVersion 5.7.0 -MaximumVersion 5.99.99
          }
          Get-Module -ListAvailable -Name Pester | Where-Object Version.Major -ge 5 | Select-Object Name, Version | Format-Table -AutoSize

      - name: Run Pester Tests (pwsh)
        if: matrix.pwsh != '5.1'
        shell: pwsh
        env:
          FORGUM_NOAUTOSTART: '1'
        run: |
          $results = Invoke-Pester -Path './Tests' -PassThru -Output Detailed

          Write-Host ""
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "Tests: $($results.TotalCount) | Passed: $($results.PassedCount) | Failed: $($results.FailedCount) | Skipped: $($results.SkippedCount)" -ForegroundColor Cyan
          Write-Host "Duration: $($results.Duration)" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan

          if ($results.FailedCount -gt 0) {
            $results.TestResult | Where-Object Result -eq 'Failed' | ForEach-Object {
              Write-Host "FAILED: $($_.Name)" -ForegroundColor Red
              Write-Host "  Error: $($_.ErrorRecord.DisplayErrorMessage)" -ForegroundColor Red
            }
            exit 1
          }

      - name: Run Pester Tests (powershell)
        if: matrix.pwsh == '5.1'
        shell: powershell
        env:
          FORGUM_NOAUTOSTART: '1'
        run: |
          $results = Invoke-Pester -Path './Tests' -PassThru -Output Detailed

          Write-Host ""
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "Tests: $($results.TotalCount) | Passed: $($results.PassedCount) | Failed: $($results.FailedCount) | Skipped: $($results.SkippedCount)" -ForegroundColor Cyan
          Write-Host "Duration: $($results.Duration)" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan

          if ($results.FailedCount -gt 0) {
            $results.TestResult | Where-Object Result -eq 'Failed' | ForEach-Object {
              Write-Host "FAILED: $($_.Name)" -ForegroundColor Red
              Write-Host "  Error: $($_.ErrorRecord.DisplayErrorMessage)" -ForegroundColor Red
            }
            exit 1
          }

  # ────────────────────────────────────────────
  # Phase 2.5: Performance Gate
  # ────────────────────────────────────────────
  perf-gate:
    needs: [test]
    runs-on: windows-latest
    name: Performance Gate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust Binary (Release)
        run: |
          cd src-rust
          cargo build --release
          cd ..
          mkdir -p bin
          cp src-rust/target/release/forgum-core.exe bin/forgum-core.exe
        shell: bash

      - name: Measure Performance
        shell: pwsh
        run: |
          $elapsed = Measure-Command {
            Import-Module ./Forgum.psd1 -Force
            Invoke-Forgum -Lolcat
          }
          Write-Host "Total Seconds: $($elapsed.TotalSeconds)"
          if ($elapsed.TotalSeconds -gt 5.0) {
            Write-Host "Performance regression detected! TotalSeconds $($elapsed.TotalSeconds) > 5.0s" -ForegroundColor Red
            exit 1
          }
          Write-Host "Performance within acceptable limits." -ForegroundColor Green

  # ────────────────────────────────────────────
  # Phase 3: Package (only on tags)
  # ────────────────────────────────────────────
  build:
    needs: [test, perf-gate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    name: Build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download Rust binaries
        uses: actions/download-artifact@v4
        with:
          path: bin_artifacts

      - name: Merge macOS Universal Binary
        run: |
          lipo -create -output bin_artifacts/forgum-core-mac bin_artifacts/forgum-core-x86_64-apple-darwin/forgum-core bin_artifacts/forgum-core-aarch64-apple-darwin/forgum-core
          chmod +x bin_artifacts/forgum-core-mac
        shell: bash

      - name: Create release package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.tag }}"
          $stagingDir = Join-Path $env:RUNNER_TEMP "Forgum-v$version"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          
          # Copy module files
          Copy-Item -Path "./${{ env.MODULE_NAME }}.psd1" -Destination $stagingDir
          Copy-Item -Path "./${{ env.MODULE_NAME }}.psm1" -Destination $stagingDir
          Copy-Item -Path "./Private" -Destination $stagingDir -Recurse
          Copy-Item -Path "./Public" -Destination $stagingDir -Recurse
          Copy-Item -Path "./Data" -Destination $stagingDir -Recurse
          Copy-Item -Path "./LICENSE" -Destination $stagingDir
          Copy-Item -Path "./README.md" -Destination $stagingDir
          Copy-Item -Path "./install.ps1" -Destination $stagingDir
          Copy-Item -Path "./install.sh" -Destination $stagingDir
          Copy-Item -Path "./uninstall.ps1" -Destination $stagingDir
          
          # Setup bin directory with compiled artifacts
          $binDir = Join-Path $stagingDir "bin"
          New-Item -ItemType Directory -Path $binDir -Force | Out-Null
          
          # Copy artifacts
          Copy-Item -Path "bin_artifacts/forgum-core-x86_64-pc-windows-msvc/forgum-core.exe" -Destination "$binDir/forgum-core.exe" -ErrorAction Stop
          Copy-Item -Path "bin_artifacts/forgum-core-aarch64-pc-windows-msvc/forgum-core.exe" -Destination "$binDir/forgum-core-arm64.exe" -ErrorAction Stop
          Copy-Item -Path "bin_artifacts/forgum-core-x86_64-unknown-linux-gnu/forgum-core" -Destination "$binDir/forgum-core" -ErrorAction Stop
          Copy-Item -Path "bin_artifacts/forgum-core-aarch64-unknown-linux-gnu/forgum-core" -Destination "$binDir/forgum-core-arm64" -ErrorAction Stop
          Copy-Item -Path "bin_artifacts/forgum-core-mac" -Destination "$binDir/forgum-core-mac" -ErrorAction Stop

          if (-not ($IsWindows -or ($env:OS -eq 'Windows_NT'))) {
              & chmod +x "$binDir/forgum-core"
              & chmod +x "$binDir/forgum-core-arm64"
              & chmod +x "$binDir/forgum-core-mac"
          }

          # Create zip using bash zip (more reliable than Compress-Archive for long paths)
          $zipPath = Join-Path $env:RUNNER_TEMP "Forgum-v$version.zip"
          Push-Location $stagingDir
          try {
            & zip -r $zipPath . | Out-Null
          } finally {
            Pop-Location
          }

          Write-Host "Package created: $zipPath"
          Copy-Item $zipPath ./Forgum-v$version.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forgum-v${{ steps.version.outputs.tag }}
          path: Forgum-v*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Forgum v${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: Forgum-v*.zip