name: Forgum CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  MODULE_NAME: Forgum

jobs:
  # ────────────────────────────────────────────
  # Phase 0: Fast parallel feedback
  # ────────────────────────────────────────────

  lint:
    runs-on: ubuntu-latest
    name: Lint (PSScriptAnalyzer)
    env:
      PSSA_VERSION: "1.24.0"
    steps:
      - uses: actions/checkout@v4

      - name: Cache PSScriptAnalyzer
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules/PSScriptAnalyzer
          key: pssa-${{ runner.os }}-${{ env.PSSA_VERSION }}-${{ hashFiles('**/PSScriptAnalyzerSettings.psd1') }}

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $minVersion = [version]$env:PSSA_VERSION
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer | Where-Object { $_.Version -ge $minVersion })) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -MinimumVersion $env:PSSA_VERSION
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $excludedRules = @(
            'PSReviewUnusedParameter'
            'PSAvoidUsingWriteHost'
            'PSUseSingularNouns'
            'PSUseBOMForUnicodeEncodedFile'
            'PSUseDeclaredVarsMoreThanAssignments'
            'PSAvoidUsingEmptyCatchBlock'
            'PSUseShouldProcessForStateChangingFunctions'
            'PSUseApprovedVerbs'
            'PSUseProcessBlockForPipelineCommand'
            'PSShouldProcess'
          )
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning -ExcludeRule $excludedRules
          if ($results) {
            Write-Host "Found $($results.Count) issue(s):" -ForegroundColor Red
            $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize
            exit 1
          }
          Write-Host "No lint errors found." -ForegroundColor Green

  validate:
    runs-on: ubuntu-latest
    name: Validate
    steps:
      - uses: actions/checkout@v4

      - name: Validate module manifest
        shell: pwsh
        run: |
          $manifest = Test-ModuleManifest -Path ./${{ env.MODULE_NAME }}.psd1 -ErrorAction Stop

          Write-Host "Module: $($manifest.Name) v$($manifest.Version)"
          Write-Host "Author: $($manifest.Author)"

          $exportKeys = @($manifest.ExportedFunctions.Keys)
          $aliasKeys  = @($manifest.ExportedAliases.Keys)

          Write-Host "Exports ($($exportKeys.Count)): $($exportKeys -join ', ')"
          Write-Host "Aliases ($($aliasKeys.Count)): $($aliasKeys -join ', ')"

          $expectedExports = @('forgum')
          $missingExports = $expectedExports | Where-Object { $_ -notin $exportKeys }
          if ($missingExports) {
            Write-Host "Missing exports: $($missingExports -join ', ')" -ForegroundColor Red
            exit 1
          }

          $expectedAliases = @(
            'forgum-setup'
            'forgum-show'
          )
          $missingAliases = $expectedAliases | Where-Object { $_ -notin $aliasKeys }
          if ($missingAliases) {
            Write-Host "Missing aliases: $($missingAliases -join ', ')" -ForegroundColor Red
            exit 1
          }

          Write-Host "All expected exports ($($expectedExports.Count)) and aliases ($($expectedAliases.Count)) exported." -ForegroundColor Green

      - name: Verify data files
        shell: pwsh
        run: |
          $cowCount = (Get-ChildItem ./Data/Cows/*.cow).Count
          Write-Host "Cow files: $cowCount"
          if ($cowCount -lt 50) {
            Write-Host "Expected at least 50 cow files" -ForegroundColor Red
            exit 1
          }

          $fortuneRaw = Get-Content ./Data/Fortunes/fortunes.txt -Raw
          $fortuneCount = ($fortuneRaw -split '%').Count
          Write-Host "Fortune entries: $fortuneCount"
          if ($fortuneCount -lt 1000) {
            Write-Host "Expected at least 1000 fortune entries" -ForegroundColor Red
            exit 1
          }

          Write-Host "Data files verified." -ForegroundColor Green

      - name: Verify animation infrastructure
        shell: pwsh
        run: |
          $animFiles = Get-ChildItem ./Private/Animation/*.ps1 -ErrorAction SilentlyContinue
          if (-not ($animFiles | Where-Object BaseName -eq 'Invoke-Engine')) {
            Write-Host "Missing Private/Animation/Invoke-Engine.ps1" -ForegroundColor Red
            exit 1
          }
          Write-Host "Animation infrastructure verified." -ForegroundColor Green

  rust-audit:
    runs-on: ubuntu-latest
    name: Rust Audit
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-audit-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: cargo-audit-${{ runner.os }}-

      - name: Rust Security Audit
        run: |
          cargo install cargo-audit
          cd engine && cargo audit

  # ────────────────────────────────────────────
  # Phase 0: Tests (depends only on lint + validate, NOT security)
  # ────────────────────────────────────────────

  test:
    needs: [lint, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pwsh: "7.4"
          - os: windows-latest
            pwsh: "7.4"
          - os: macos-latest
            pwsh: "7.4"
    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.os }} pwsh ${{ matrix.pwsh }})
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            engine/target
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Run Rust Tests
        run: |
          cd engine && cargo test --verbose

      - name: Install Targets (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          rustup target add x86_64-pc-windows-msvc
          rustup target add aarch64-pc-windows-msvc

      - name: Install Targets (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add x86_64-unknown-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      - name: Install Targets (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Build Windows Binaries
        if: matrix.os == 'windows-latest'
        run: |
          cd engine
          cargo build --release --target x86_64-pc-windows-msvc
          cargo build --release --target aarch64-pc-windows-msvc
          cd ..
          mkdir -p bin
          cp engine/target/x86_64-pc-windows-msvc/release/forgum-engine.exe bin/forgum-engine.exe
          cp engine/target/aarch64-pc-windows-msvc/release/forgum-engine.exe bin/forgum-engine-arm64.exe
        shell: bash

      - name: Build Linux Binaries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          cd engine
          cargo build --release --target x86_64-unknown-linux-gnu
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc cargo build --release --target aarch64-unknown-linux-gnu
          cd ..
          mkdir -p bin
          cp engine/target/x86_64-unknown-linux-gnu/release/forgum-engine bin/forgum-engine
          cp engine/target/aarch64-unknown-linux-gnu/release/forgum-engine bin/forgum-engine-arm64
          chmod +x bin/forgum-engine bin/forgum-engine-arm64
        shell: bash

      - name: Build macOS Binaries
        if: matrix.os == 'macos-latest'
        run: |
          cd engine
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cd ..
          mkdir -p bin
          cp engine/target/x86_64-apple-darwin/release/forgum-engine bin/forgum-engine-x64
          cp engine/target/aarch64-apple-darwin/release/forgum-engine bin/forgum-engine-arm64
          chmod +x bin/forgum-engine-x64 bin/forgum-engine-arm64
        shell: bash

      - name: Upload Windows x64 Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: forgum-engine-x86_64-pc-windows-msvc
          path: engine/target/x86_64-pc-windows-msvc/release/forgum-engine.exe
          if-no-files-found: error

      - name: Upload Windows ARM64 Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: forgum-engine-aarch64-pc-windows-msvc
          path: engine/target/aarch64-pc-windows-msvc/release/forgum-engine.exe
          if-no-files-found: error

      - name: Upload Linux x64 Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: forgum-engine-x86_64-unknown-linux-gnu
          path: engine/target/x86_64-unknown-linux-gnu/release/forgum-engine
          if-no-files-found: error

      - name: Upload Linux ARM64 Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: forgum-engine-aarch64-unknown-linux-gnu
          path: engine/target/aarch64-unknown-linux-gnu/release/forgum-engine
          if-no-files-found: error

      - name: Upload macOS x64 Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: forgum-engine-x86_64-apple-darwin
          path: engine/target/x86_64-apple-darwin/release/forgum-engine
          if-no-files-found: error

      - name: Upload macOS ARM64 Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: forgum-engine-aarch64-apple-darwin
          path: engine/target/aarch64-apple-darwin/release/forgum-engine
          if-no-files-found: error

      - name: Cache Pester + modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/powershell/Modules
            ~/Documents/PowerShell/Modules
          key: modules-pester-5.7-${{ runner.os }}-${{ hashFiles('**/Forgum.psd1') }}

      - name: Install Pester (pwsh)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version.Major -ge 5 })) {
            Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser -MinimumVersion 5.7.0 -MaximumVersion 5.99.99
          }
          Get-Module -ListAvailable -Name Pester | Where-Object Version.Major -ge 5 | Select-Object Name, Version | Format-Table -AutoSize

      - name: Run Pester Tests
        shell: pwsh
        env:
          FORGUM_NOAUTOSTART: "1"
        run: |
          $results = Invoke-Pester -Path './Tests' -PassThru -Output Detailed

          Write-Host ""
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "Tests: $($results.TotalCount) | Passed: $($results.PassedCount) | Failed: $($results.FailedCount) | Skipped: $($results.SkippedCount)" -ForegroundColor Cyan
          Write-Host "Duration: $($results.Duration)" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan

          if ($results.FailedCount -gt 0) {
            $results.TestResult | Where-Object Result -eq 'Failed' | ForEach-Object {
              Write-Host "FAILED: $($_.Name)" -ForegroundColor Red
              Write-Host "  Error: $($_.ErrorRecord.DisplayErrorMessage)" -ForegroundColor Red
            }
            exit 1
          }

      - name: Test Shell Integrations (Bash, Zsh, Fish)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish bash

          echo "Testing Bash..."
          OUTPUT_BASH=$(bash -c 'pwsh -NoProfile -Command "Import-Module ./Forgum.psd1; forgum run ''Bash test''"')
          echo "$OUTPUT_BASH" | grep -E "(__|\(oo\))" > /dev/null || (echo "Bash test failed: $OUTPUT_BASH" && exit 1)

          echo "Testing Zsh..."
          OUTPUT_ZSH=$(zsh -c 'pwsh -NoProfile -Command "Import-Module ./Forgum.psd1; forgum run ''Zsh test''"')
          echo "$OUTPUT_ZSH" | grep -E "(__|\(oo\))" > /dev/null || (echo "Zsh test failed: $OUTPUT_ZSH" && exit 1)

          echo "Testing Fish..."
          OUTPUT_FISH=$(fish -c 'pwsh -NoProfile -Command "Import-Module ./Forgum.psd1; forgum run ''Fish test''"')
          echo "$OUTPUT_FISH" | grep -E "(__|\(oo\))" > /dev/null || (echo "Fish test failed: $OUTPUT_FISH" && exit 1)

          echo "All shell integration tests passed!"

  # ────────────────────────────────────────────
  # Phase 1: Performance Gate
  # ────────────────────────────────────────────

  perf-gate:
    needs: [test]
    runs-on: windows-latest
    name: Performance Gate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            engine/target
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build Rust Binary (Release)
        run: |
          cd engine
          cargo build --release
          cd ..
          mkdir -p bin
          cp engine/target/release/forgum-engine.exe bin/forgum-engine.exe
        shell: bash

      - name: Measure Performance
        shell: pwsh
        run: |
          $elapsed = Measure-Command {
            Import-Module ./Forgum.psd1 -Force
            forgum run "perf-test" 2>&1 | Out-Null
          }
          Write-Host "Total Seconds: $($elapsed.TotalSeconds)"
          if ($elapsed.TotalSeconds -gt 5.0) {
            Write-Host "Performance regression detected! TotalSeconds $($elapsed.TotalSeconds) > 5.0s" -ForegroundColor Red
            exit 1
          }
          Write-Host "Performance within acceptable limits." -ForegroundColor Green

  # ────────────────────────────────────────────
  # Phase 2: Mutation Testing (weekly cron only)
  # ────────────────────────────────────────────

  cargo-mutants:
    runs-on: ubuntu-latest
    name: Mutation Testing
    if: github.event_name == 'schedule'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            engine/target
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-mutants-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: cargo-mutants-${{ runner.os }}-

      - name: Install cargo-mutants
        run: cargo install --version 24.11.0 cargo-mutants

      - name: Run Mutation Testing
        run: |
          cd engine
          cargo mutants --no-times --fail-under 0

  # ────────────────────────────────────────────
  # Phase 3: Package (only on tags)
  # ────────────────────────────────────────────

  build:
    needs: [test, perf-gate, rust-audit]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    name: Build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download Rust binaries
        uses: actions/download-artifact@v4
        with:
          path: bin_artifacts

      - name: Merge macOS Universal Binary
        run: |
          lipo -create -output bin_artifacts/forgum-engine-mac bin_artifacts/forgum-engine-x86_64-apple-darwin/forgum-engine bin_artifacts/forgum-engine-aarch64-apple-darwin/forgum-engine
          chmod +x bin_artifacts/forgum-engine-mac
        shell: bash

      - name: Create release package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.tag }}"
          $stagingDir = Join-Path $env:RUNNER_TEMP "Forgum-v$version"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null

          # Copy module files
          Copy-Item -Path "./${{ env.MODULE_NAME }}.psd1" -Destination $stagingDir
          Copy-Item -Path "./${{ env.MODULE_NAME }}.psm1" -Destination $stagingDir
          Copy-Item -Path "./Private" -Destination $stagingDir -Recurse
          Copy-Item -Path "./Public" -Destination $stagingDir -Recurse
          Copy-Item -Path "./Data" -Destination $stagingDir -Recurse
          Copy-Item -Path "./LICENSE" -Destination $stagingDir
          Copy-Item -Path "./README.md" -Destination $stagingDir
          Copy-Item -Path "./install.ps1" -Destination $stagingDir
          Copy-Item -Path "./install.sh" -Destination $stagingDir
          Copy-Item -Path "./uninstall.ps1" -Destination $stagingDir

          # Setup bin directory with compiled artifacts
          $binDir = Join-Path $stagingDir "bin"
          New-Item -ItemType Directory -Path $binDir -Force | Out-Null

          # Copy artifacts
          Copy-Item -Path "bin_artifacts/forgum-engine-x86_64-pc-windows-msvc/forgum-engine.exe" -Destination "$binDir/forgum-engine.exe" -ErrorAction Stop
          Copy-Item -Path "bin_artifacts/forgum-engine-aarch64-pc-windows-msvc/forgum-engine.exe" -Destination "$binDir/forgum-engine-arm64.exe" -ErrorAction Stop
          Copy-Item -Path "bin_artifacts/forgum-engine-x86_64-unknown-linux-gnu/forgum-engine" -Destination "$binDir/forgum-engine" -ErrorAction Stop
          Copy-Item -Path "bin_artifacts/forgum-engine-aarch64-unknown-linux-gnu/forgum-engine" -Destination "$binDir/forgum-engine-arm64" -ErrorAction Stop
          Copy-Item -Path "bin_artifacts/forgum-engine-mac" -Destination "$binDir/forgum-engine-mac" -ErrorAction Stop

          if (-not ($IsWindows -or ($env:OS -eq 'Windows_NT'))) {
              & chmod +x "$binDir/forgum-engine"
              & chmod +x "$binDir/forgum-engine-arm64"
              & chmod +x "$binDir/forgum-engine-mac"
          }

          # Create zip using bash zip
          $zipPath = Join-Path $env:RUNNER_TEMP "Forgum-v$version.zip"
          Push-Location $stagingDir
          try {
            & zip -r $zipPath . | Out-Null
          } finally {
            Pop-Location
          }

          Write-Host "Package created: $zipPath"
          Copy-Item $zipPath ./Forgum-v$version.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forgum-v${{ steps.version.outputs.tag }}
          path: Forgum-v*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Forgum v${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: Forgum-v*.zip

  # ────────────────────────────────────────────
  # Full matrix on main push (after tests pass)
  # ────────────────────────────────────────────

  test-full:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pwsh: "5.1"
    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.os }} pwsh ${{ matrix.pwsh }})
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            engine/target
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Run Rust Tests
        run: cd engine && cargo test --verbose

      - name: Build Binaries
        run: |
          cd engine
          cargo build --release
          cd ..
          mkdir -p bin
          cp engine/target/release/forgum-engine.exe bin/forgum-engine.exe 2>/dev/null || cp engine/target/release/forgum-engine bin/forgum-engine
          chmod +x bin/forgum-engine 2>/dev/null || true
        shell: bash

      - name: Cache Pester + modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/powershell/Modules
            ~/Documents/PowerShell/Modules
          key: modules-pester-5.7-${{ runner.os }}-${{ hashFiles('**/Forgum.psd1') }}

      - name: Install Pester
        shell: ${{ matrix.pwsh == '5.1' && 'powershell' || 'pwsh' }}
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version.Major -ge 5 })) {
            Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser -MinimumVersion 5.7.0 -MaximumVersion 5.99.99
          }

      - name: Run Pester Tests
        shell: ${{ matrix.pwsh == '5.1' && 'powershell' || 'pwsh' }}
        env:
          FORGUM_NOAUTOSTART: "1"
        run: |
          $results = Invoke-Pester -Path './Tests' -PassThru -Output Detailed
          Write-Host "Tests: $($results.TotalCount) | Passed: $($results.PassedCount) | Failed: $($results.FailedCount)" -ForegroundColor Cyan
          if ($results.FailedCount -gt 0) {
            $results.TestResult | Where-Object Result -eq 'Failed' | ForEach-Object {
              Write-Host "FAILED: $($_.Name)" -ForegroundColor Red
              Write-Host "  Error: $($_.ErrorRecord.DisplayErrorMessage)" -ForegroundColor Red
            }
            exit 1
          }
