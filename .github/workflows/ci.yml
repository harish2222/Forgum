name: Forgum CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  MODULE_NAME: Forgum

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint (PSScriptAnalyzer)
    steps:
      - uses: actions/checkout@v4

      - name: Cache PSScriptAnalyzer
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules/PSScriptAnalyzer
          key: pssa-${{ runner.os }}-1.24.0-${{ hashFiles('**/PSScriptAnalyzerSettings.psd1') }}

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer | Where-Object { $_.Version -ge [version]'1.24.0' })) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -MinimumVersion 1.24.0
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $excludedRules = @(
            'PSReviewUnusedParameter'
            'PSAvoidUsingWriteHost'
            'PSUseSingularNouns'
            'PSUseBOMForUnicodeEncodedFile'
            'PSUseDeclaredVarsMoreThanAssignments'
            'PSAvoidUsingEmptyCatchBlock'
            'PSUseShouldProcessForStateChangingFunctions'
            'PSUseApprovedVerbs'
            'PSUseProcessBlockForPipelineCommand'
            'PSShouldProcess'
          )
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning -ExcludeRule $excludedRules
          if ($results) {
            Write-Host "Found $($results.Count) issue(s):" -ForegroundColor Red
            $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize
            exit 1
          }
          Write-Host "No lint errors found." -ForegroundColor Green

  validate:
    runs-on: ubuntu-latest
    name: Validate
    steps:
      - uses: actions/checkout@v4

      - name: Validate module manifest
        shell: pwsh
        run: |
          $manifest = Test-ModuleManifest -Path ./${{ env.MODULE_NAME }}.psd1 -ErrorAction Stop
          Write-Host "Module: $($manifest.Name) v$($manifest.Version)"
          $exportKeys = @($manifest.ExportedFunctions.Keys)
          Write-Host "Exports ($($exportKeys.Count)): $($exportKeys -join ', ')"
          $expectedExports = @('forgum')
          $missingExports = $expectedExports | Where-Object { $_ -notin $exportKeys }
          if ($missingExports) {
            Write-Host "Missing exports: $($missingExports -join ', ')" -ForegroundColor Red
            exit 1
          }
          Write-Host "All expected exports present." -ForegroundColor Green

      - name: Verify data files
        shell: pwsh
        run: |
          $cowCount = (Get-ChildItem ./Data/Cows/*.cow).Count
          Write-Host "Cow files: $cowCount"
          if ($cowCount -lt 50) {
            Write-Host "Expected at least 50 cow files" -ForegroundColor Red
            exit 1
          }
          $fortuneRaw = Get-Content ./Data/Fortunes/fortunes.txt -Raw
          $fortuneCount = ($fortuneRaw -split '%').Count
          Write-Host "Fortune entries: $fortuneCount"
          if ($fortuneCount -lt 1000) {
            Write-Host "Expected at least 1000 fortune entries" -ForegroundColor Red
            exit 1
          }
          Write-Host "Data files verified." -ForegroundColor Green

  test:
    needs: [lint, validate]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.os }})
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            engine/target
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('engine/src/**/*.rs', 'engine/Cargo.toml', 'engine/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Run Rust Tests
        shell: bash
        run: cd engine && cargo test --verbose

      - name: Build Engine (Release)
        shell: bash
        run: |
          cd engine
          cargo build --release
          cd ..
          mkdir -p bin
          cp engine/target/release/forgum-engine.exe bin/forgum-engine.exe 2>/dev/null || cp engine/target/release/forgum-engine bin/forgum-engine
          chmod +x bin/forgum-engine 2>/dev/null || true

      - name: Cache Pester + modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/powershell/Modules
            ~/Documents/PowerShell/Modules
          key: modules-pester-5.7-${{ runner.os }}-${{ hashFiles('**/Forgum.psd1') }}

      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version.Major -ge 5 })) {
            Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser -MinimumVersion 5.7.0 -MaximumVersion 5.99.99
          }

      - name: Run Pester Tests
        shell: pwsh
        env:
          FORGUM_NOAUTOSTART: "1"
        run: |
          $results = Invoke-Pester -Path './Tests' -PassThru -Output Detailed

          Write-Host ""
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "Tests: $($results.TotalCount) | Passed: $($results.PassedCount) | Failed: $($results.FailedCount) | Skipped: $($results.SkippedCount)" -ForegroundColor Cyan
          Write-Host "Duration: $($results.Duration)" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan

          if ($results.FailedCount -gt 0) {
            $results.TestResult | Where-Object Result -eq 'Failed' | ForEach-Object {
              Write-Host "FAILED: $($_.Name)" -ForegroundColor Red
              Write-Host "  Error: $($_.ErrorRecord.DisplayErrorMessage)" -ForegroundColor Red
            }
            exit 1
          }

  perf-gate:
    needs: [test]
    runs-on: windows-latest
    name: Performance Gate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            engine/target
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('engine/src/**/*.rs', 'engine/Cargo.toml', 'engine/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build Rust Binary (Release)
        shell: bash
        run: |
          cd engine
          cargo build --release
          cd ..
          mkdir -p bin
          cp engine/target/release/forgum-engine.exe bin/forgum-engine.exe

      - name: Measure Performance
        shell: pwsh
        run: |
          $elapsed = Measure-Command {
            Import-Module ./Forgum.psd1 -Force
            forgum run "perf-test" 2>&1 | Out-Null
          }
          Write-Host "Total Seconds: $($elapsed.TotalSeconds)"
          if ($elapsed.TotalSeconds -gt 5.0) {
            Write-Host "Performance regression! $($elapsed.TotalSeconds)s > 5.0s" -ForegroundColor Red
            exit 1
          }
          Write-Host "Performance within limits." -ForegroundColor Green

  build:
    needs: [test, perf-gate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    name: Build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download Rust binaries
        uses: actions/download-artifact@v4
        with:
          path: bin_artifacts

      - name: Merge macOS Universal Binary
        shell: bash
        run: |
          lipo -create -output bin_artifacts/forgum-engine-mac bin_artifacts/forgum-engine-x86_64-apple-darwin/forgum-engine bin_artifacts/forgum-engine-aarch64-apple-darwin/forgum-engine
          chmod +x bin_artifacts/forgum-engine-mac

      - name: Create release package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.tag }}"
          $stagingDir = Join-Path $env:RUNNER_TEMP "Forgum-v$version"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null

          Copy-Item -Path "./${{ env.MODULE_NAME }}.psd1" -Destination $stagingDir
          Copy-Item -Path "./${{ env.MODULE_NAME }}.psm1" -Destination $stagingDir
          Copy-Item -Path "./Private" -Destination $stagingDir -Recurse
          Copy-Item -Path "./Public" -Destination $stagingDir -Recurse
          Copy-Item -Path "./Data" -Destination $stagingDir -Recurse
          Copy-Item -Path "./LICENSE" -Destination $stagingDir
          Copy-Item -Path "./README.md" -Destination $stagingDir
          Copy-Item -Path "./install.ps1" -Destination $stagingDir
          Copy-Item -Path "./install.sh" -Destination $stagingDir
          Copy-Item -Path "./uninstall.ps1" -Destination $stagingDir

          $binDir = Join-Path $stagingDir "bin"
          New-Item -ItemType Directory -Path $binDir -Force | Out-Null

          Copy-Item -Path "bin_artifacts/forgum-engine-x86_64-pc-windows-msvc/forgum-engine.exe" -Destination "$binDir/forgum-engine.exe" -ErrorAction SilentlyContinue
          Copy-Item -Path "bin_artifacts/forgum-engine-aarch64-pc-windows-msvc/forgum-engine.exe" -Destination "$binDir/forgum-engine-arm64.exe" -ErrorAction SilentlyContinue
          Copy-Item -Path "bin_artifacts/forgum-engine-x86_64-unknown-linux-gnu/forgum-engine" -Destination "$binDir/forgum-engine" -ErrorAction SilentlyContinue
          Copy-Item -Path "bin_artifacts/forgum-engine-aarch64-unknown-linux-gnu/forgum-engine" -Destination "$binDir/forgum-engine-arm64" -ErrorAction SilentlyContinue
          Copy-Item -Path "bin_artifacts/forgum-engine-mac" -Destination "$binDir/forgum-engine-mac" -ErrorAction SilentlyContinue

          $zipPath = Join-Path $env:RUNNER_TEMP "Forgum-v$version.zip"
          Push-Location $stagingDir
          try {
            & zip -r $zipPath . | Out-Null
          } finally {
            Pop-Location
          }

          Copy-Item $zipPath ./Forgum-v$version.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forgum-v${{ steps.version.outputs.tag }}
          path: Forgum-v*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Forgum v${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: Forgum-v*.zip
